<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talk all you want✨ - TarGPT</title>
    <script src="api.js"></script>
    <script src="function.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <section class="sidebar">
      <div>
        <div class="logo"><img src="/stock/logo.webp" alt="" /></div>
        <div id="toggle-sidebar">
          <i class="bi bi-layout-sidebar-inset"></i>
        </div>
        <div><i class="bi bi-node-plus-fill"></i>New chat</div>
        <div>
          <a href="https://www.google.com/" target="_blank">
            <i class="bi bi-google"></i>Google something</a
          >
        </div>
        <div id="oldchats"></div>
      </div>
    </section>
    <main>
      <nav><span>TarGPT 999+</span></nav>
      <div class="welcome"></div>
      <div class="chatbar">
        <input type="text" />
        <button type="submit" class="send-button disable">
          <i id="send_icon" class="bi bi-arrow-up-circle-fill"></i>
        </button>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
